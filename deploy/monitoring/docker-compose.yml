name: jo-workspace-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    ports:
      []
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    networks: [monitoring]
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    ports:
      []
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets: [grafana_admin]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
      - '127.0.0.1:3000:3000'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [prometheus, grafana]
    networks: [access, monitoring]
networks:
  access:
  monitoring:
    internal: true
volumes:
  prometheus-data:
  grafana-data:
secrets:
  grafana_admin:
    file: ./runtime/grafana-admin-password
